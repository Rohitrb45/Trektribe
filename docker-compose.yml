services:
  database:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: trektribe
      POSTGRES_USER: trektribe
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - trektribe_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trektribe -d trektribe"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  trektribe_db:
